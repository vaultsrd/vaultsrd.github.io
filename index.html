<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchpad</title>

    <!-- Favicon / Icon (emoji laptop via SVG data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">

    <link rel="alternate icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b1020;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .frame-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* ====== LOADER TEMA CODING ====== */
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 40%, #101a33, #05070f 70%);
            z-index: 2;
            transition: opacity .6s ease, visibility .6s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Jendela editor */
        .editor {
            width: min(90vw, 460px);
            background: #0d1117;
            border: 1px solid #1f2937;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(124, 92, 255, .08);
            overflow: hidden;
            animation: rise .5s ease both;
        }

        @keyframes rise {
            from { transform: translateY(14px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* Title bar ala editor */
        .titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #161b22;
            border-bottom: 1px solid #1f2937;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot.red    { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green  { background: #28c840; }

        .filename {
            margin-left: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #7d8590;
            letter-spacing: .5px;
        }

        /* Area kode */
        .code {
            padding: 18px 20px 8px;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13.5px;
            line-height: 1.7;
            color: #c9d1d9;
            min-height: 120px;
        }

        .line {
            display: block;
            white-space: pre;
        }

        .ln {
            color: #3d4451;
            display: inline-block;
            width: 22px;
            user-select: none;
        }

        /* Warna syntax */
        .kw  { color: #ff7b72; }   /* keyword */
        .fn  { color: #d2a8ff; }   /* function */
        .str { color: #a5d6ff; }   /* string */
        .var { color: #79c0ff; }   /* variable */
        .cmt { color: #6e7681; font-style: italic; }
        .punc{ color: #c9d1d9; }
        .num { color: #79c0ff; }

        /* Kursor berkedip */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #38d9ff;
            vertical-align: -2px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Status bar / progress */
        .statusbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px 14px;
            border-top: 1px solid #1f2937;
        }

        .terminal-icon {
            font-size: 13px;
            color: #38d9ff;
            font-family: 'Courier New', monospace;
        }

        .bar {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: rgba(124, 92, 255, .15);
            overflow: hidden;
        }

        .bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #7c5cff, #38d9ff);
            border-radius: 3px;
            animation: slide 1.2s ease-in-out infinite;
        }

        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .percent {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #7d8590;
            letter-spacing: 1px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="frame-wrapper">
        <div class="loader" id="loader">
            <div class="editor">
                <div class="titlebar">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                    <span class="filename">launchpad.js</span>
                </div>

                <div class="code">
                    <span class="line"><span class="ln">1</span><span class="cmt">// booting launchpad…</span></span>
                    <span class="line"><span class="ln">2</span><span class="kw">const</span> <span class="var">app</span> <span class="punc">=</span> <span class="fn">require</span><span class="punc">(</span><span class="str">'./launchpad'</span><span class="punc">);</span></span>
                    <span class="line"><span class="ln">3</span><span class="kw">await</span> <span class="var">app</span><span class="punc">.</span><span class="fn">init</span><span class="punc">({</span> <span class="var">ready</span><span class="punc">:</span> <span class="kw">true</span> <span class="punc">});</span></span>
                    <span class="line"><span class="ln">4</span><span class="fn">console</span><span class="punc">.</span><span class="fn">log</span><span class="punc">(</span><span class="str">'🚀 launching...'</span><span class="punc">);</span><span class="cursor"></span></span>
                </div>

                <div class="statusbar">
                    <span class="terminal-icon">&gt;_</span>
                    <div class="bar"></div>
                    <span class="percent">building…</span>
                </div>
            </div>
        </div>

        <iframe
            id="appFrame"
            src="https://script.google.com/macros/s/AKfycbwv-aa9WOKTjGnwLyKgbTOVnQoTKlK2AknKqm1XJVb_oat1_zD_zBilqI4JeVJUlwyY/exec"
            title="Launchpad Application"
            allow="clipboard-read; clipboard-write; fullscreen"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('appFrame');
        const loader = document.getElementById('loader');

        // Sembunyikan loader saat iframe selesai dimuat
        iframe.addEventListener('load', () => {
            setTimeout(() => loader.classList.add('hidden'), 400);
        });

        // Fallback: sembunyikan loader setelah 8 detik (jika event load tidak terpicu)
        setTimeout(() => loader.classList.add('hidden'), 8000);
    </script>

</body>
</html>
